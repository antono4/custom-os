# LightDM Configuration
# Custom Linux Distribution

[LightDM]
# Guest account
allow-guest=true

# Seat configuration
start-default-seat=true
seats=seat0

#greeter configuration
greeter-session=lightdm-gtk-greeter
greeter-hide-users=false
greeter-allow-guest=true

# User configuration
minimum-uid=1000
hide-users=nobody
hidden-shells=/bin/false

# Session configuration
session-wrapper=/etc/lightdm/Xsession
default-user=root

# Logging
log-directory=/var/log/lightdm
run-directory=/run/lightdm

[Seat:*]
# X server
xserver-command=X -core

# X server options
xserver-display-config=lightdm-gtk-greeter

# Allow remote sessions
xserver-allow-tcp=true

# Enable automatic login
# autologin-user=

# Session type
user-session=default

# VTs
vtn=1
vtn=2
vtn=3
vtn=4
vtn=5
vtn=6
vtn=7

# Hardware configuration
xserver-config=xorg.conf

# Seat type
type=local

[Seat:seat0]
# Seat display configuration
xserver-command=X -core
xserver-layout=default
xserver-allow-tcp=false

# Greeter
greeter-session=lightdm-gtk-greeter
greeter-hide-users=false
session-wrapper=/etc/lightdm/Xsession

# User session
user-session=default

# LightDM GTK Greeter
greeter-hide-users=false
greeter-show-manual-login=true
greeter-allow-guest=true

# Session types available
session-types=gnome-session;xfce;lxde;openbox;i3;mate

# Background
background=/usr/share/backgrounds/default.png

# XDG directories
xDG_SESSION_DESKTOP=default
xDG_CURRENT_DESKTOP=CustomLFS

# Keyboard layout
keyboard=
keyboard-options=

# Pointer
pointer=
pointer-device=/dev/input/mice

# Monitor settings
monitor=